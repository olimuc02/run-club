  const me = S.people[S.me], shoes = me.shoes || [];
  openSheet(`<h3>Settings <button onclick="closeSheet()">Done</button></h3>
    <div class="fld"><label>This Phone Belongs To</label>
      <div class="opts">${WHO.map(w=>`<button class="opt ${S.me===w?'on':''}" onclick="setMe('${w}');openSettings()">${P[w].name}</button>`).join('')}</div>
    </div>
    <div class="fld"><label>My Weekly Goal</label>
      <div class="opts">${[1,2,3,4,5,6,7].map(n=>`<button class="opt ${weekGoal(S.me)===n?'on':''}" onclick="setGoal('week',${n})">${n}×</button>`).join('')}</div>
      <div class="small-note">Runs per week. Fills the ring on Home and drives your weekly goal streak.</div>
    </div>
    <div class="fld"><label>My ${today().slice(0,4)} Mileage Goal</label>
      <div class="loc-row"><input class="in" id="sYear" type="number" inputmode="numeric" min="0" placeholder="e.g. 500" value="${yearGoal(S.me)||''}"><button onclick="setGoal('year', +$('#sYear').value)" style="width:auto;padding:0 14px;font-weight:800">Save</button></div>
    </div>
    <div class="fld"><label>Break Mode</label>
      <button class="btn ice full" onclick="openBreak()">${activeBreak(S.me) ? breakLabel(activeBreak(S.me)).e+' On Break · Manage' : '🧊 Take A Break / Rest Day'}</button>
    </div>
    <div class="fld"><label>My Shoes</label>
      ${shoes.length ? `<div class="box" style="padding:4px 14px;margin-bottom:10px">${shoes.map(s=>{ const m = sumMi(logsOf(S.me).filter(l=>l.shoe===s.id)); return `<div class="list-item"><div class="grow">${esc(s.name)}<small>${mi1(m)} / ${s.limit||400} mi${s.retired?' · retired':''}</small></div><button class="btn sm" onclick="retireShoe('${s.id}')">${s.retired?'Unretire':'Retire'}</button></div>`; }).join('')}</div>` : ''}
      <div class="loc-row"><input class="in" id="sShoe" maxlength="40" placeholder="Nike Pegasus 41"><button onclick="addShoe()" style="width:auto;padding:0 14px;font-weight:800">Add</button></div>
      <div class="small-note">Tracks miles per pair and warns you around 400 mi.</div>
    </div>
    <div class="fld"><label>Club Started</label>
      <input class="in" type="date" id="sStart" value="${clubStart()}">
      <div class="small-note">Streaks and weekly duels count from this date. Changes it for both of you.</div>
    </div>
    <div class="fld"><label>Add To Home Screen</label>
      <div class="small-note">iPhone: open this page in Safari → Share → <b>Add to Home Screen</b>.</div>
    </div>
    <div class="fld"><label>Share With Your Partner</label><button class="btn full" onclick="shareApp()">Send The Link</button></div>`);
  $('#sStart').onchange = e=>{ if(!e.target.value) return; S.cfg.start = e.target.value; pushCfg(); saveLocal(); render(); toast('Club start set: '+fmtDate(S.cfg.start,{month:'long',day:'numeric'})); };
}
function setGoal(k, v){ const me = S.people[S.me]; me.goal = {...(me.goal||{}), [k]: Math.max(0, Math.round(+v||0))}; pushPerson(); render(); openSettings(); toast(k==='week' ? '🎯 Weekly goal: '+v+' runs' : (v ? '🎯 Yearly goal: '+Math.round(v)+' mi' : 'Yearly goal cleared')); }
function addShoe(){ const n = $('#sShoe').value.trim(); if(!n) return; const me = S.people[S.me]; me.shoes = [...(me.shoes||[]), {id:uid(), name:n, limit:400, retired:false, added:today()}]; pushPerson(); openSettings(); toast('👟 Added '+n); }
function retireShoe(id){ const s = (S.people[S.me].shoes||[]).find(x=>x.id===id); if(!s) return; s.retired = !s.retired; pushPerson(); openSettings(); }
async function shareApp(){
  const data = {title:'Run Club', text:'Our running club — log your runs here 🏃', url: location.href.split('#')[0]};
  if(navigator.share){ try{ await navigator.share(data); }catch(e){} }
  else { try{ await navigator.clipboard.writeText(data.url); toast('Link copied'); }catch(e){ prompt('Copy this link', data.url); } }
}
$('#meChip').onclick = ()=> S.me ? openSettings() : pickWho();

/* ============================== confetti ============================== */
function confetti(color){
  const cv = $('#fx'), ctx = cv.getContext('2d'), dpr = devicePixelRatio||1;
  cv.width = innerWidth*dpr; cv.height = innerHeight*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  const cols = [color, '#ffffff', '#ffc53d', color, '#b48cff', '#ff7a2f'];
  const parts = Array.from({length:140},()=>({x:innerWidth/2, y:innerHeight*.75, vx:(Math.random()-.5)*14, vy:-Math.random()*16-6, r:Math.random()*6+3, c:cols[Math.random()*cols.length|0], a:Math.random()*6, va:(Math.random()-.5)*.4}));
  let f = 0;
  (function tick(){
    ctx.clearRect(0,0,innerWidth,innerHeight);
    parts.forEach(p=>{ p.vy += .42; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.globalAlpha = Math.max(0, 1 - f/110); ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); ctx.restore(); });
    if(++f < 110) requestAnimationFrame(tick); else ctx.clearRect(0,0,innerWidth,innerHeight);
  })();
  if(navigator.vibrate) navigator.vibrate([20,40,20]);
}

/* ============================== nav ============================== */
function go(v){
  if($('#sheet').classList.contains('on')) closeSheet();
  S.view = v;
  document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on', x.id==='v-'+v));
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on', x.dataset.v===v));
  render(); scrollTo({top:0});
}
document.querySelectorAll('.tab').forEach(t=>t.onclick = ()=>go(t.dataset.v));
$('#fab').onclick = ()=>openLog();
function paintChrome(){
  const tab = document.querySelector('.tab[data-v="ch"]');
  const has = pendingInvites().length > 0, b = tab.querySelector('.bdg');
  if(has && !b) tab.insertAdjacentHTML('beforeend','<span class="bdg"></span>'); else if(!has && b) b.remove();
}
function render(){
  REC = null; paintChrome();
  ({home:renderHome, feed:renderFeed, ch:renderCh, stats:renderStats})[S.view]();
}
let softT = null;
function softRender(){
  clearTimeout(softT);
  softT = setTimeout(()=>{
    const a = document.activeElement;
    if(a && a.closest && a.closest('.cmt-in') && a.value) return;
    REC = null; paintChrome();
    if(S.view === 'stats') renderStats(); else render();
    if($('#sheet').classList.contains('on') && sheetCtx && sheetCtx.kind === 'day') openDay(sheetCtx.d);
    checkChEvents();
  }, 60);
}

/* ============================== cloud sync (Firestore) ============================== */
const FB = {
  apiKey:"AIzaSyDu-bAYH7t7rf-y3Fs0K1GjyvjFrSTDSSc",
  authDomain:"tasks-oj.firebaseapp.com",
  projectId:"tasks-oj",
  storageBucket:"tasks-oj.firebasestorage.app",
  messagingSenderId:"165391193367",
  appId:"1:165391193367:web:5c839c148f4b4d00a95352"
};
let db = null, FS = null, syncOn = false;
function syncState(kind, txt){ $('#syncPill .dot').className = 'dot '+kind; $('#syncTxt').textContent = txt; }
async function initCloud(){
  try{
    const [app, store] = await Promise.all([
      import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js'),
      import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js')
    ]);
    FS = store;
    const a = app.initializeApp(FB);
    // memory-only cache: Firestore's on-disk cache tends to wedge on iPhone home-screen apps
    try{ db = store.initializeFirestore(a, {localCache: store.memoryLocalCache(), experimentalAutoDetectLongPolling: true}); }
    catch(e){ db = store.getFirestore(a); }
    syncOn = true; syncState('', 'Connecting');
    try{ indexedDB.deleteDatabase('firestore/[DEFAULT]/tasks-oj/main'); }catch(e){}
    let firstLogs = true, firstCfg = true;

    // run_config holds: main (club start + nudges), p_oliver / p_alexis (breaks, shoes, goals), ch_* (challenges)
    store.onSnapshot(store.collection(db,'run_config'), snap=>{
      let touched = false;
      snap.docChanges().forEach(chg=>{
        const id = chg.doc.id, d = chg.doc.data();
        if(id === 'main'){
          if(chg.type === 'removed') return;
          const before = JSON.stringify(S.cfg); S.cfg = {...S.cfg, ...d};
          if(JSON.stringify(S.cfg) !== before) touched = true;
        } else if(id.startsWith('p_')){
          const w = id.slice(2); if(!P[w] || chg.type === 'removed') return;
          const mine = S.people[w] || {};
          if(w === S.me && (mine.updatedAt||0) > (d.updatedAt||0)) return;   // my newer local copy wins; it gets re-sent
          if(JSON.stringify(mine) !== JSON.stringify(d)){ S.people[w] = d; touched = true; }
        } else if(id.startsWith('ch_')){
          if(chg.type === 'removed'){ if(S.ch[id]){ delete S.ch[id]; touched = true; } return; }
          const isNew = !S.ch[id];
          if(JSON.stringify(S.ch[id]) !== JSON.stringify(d)){
            S.ch[id] = d; touched = true;
            if(isNew && !firstCfg && S.me && d.createdBy !== S.me) toast(`<span style="font-size:22px">📨</span><span><b>${P[d.createdBy]?.name}</b> challenged you: ${esc(d.emoji+' '+d.name)}</span>`, 6000);
          }
        }
      });
      if(!snap.metadata.fromCache && firstCfg){
        firstCfg = false;
        const cloud = new Set(snap.docs.map(x=>x.id));
        migrateOriginal(cloud);
        if(S.me && S.people[S.me] && S.people[S.me].updatedAt && (!cloud.has('p_'+S.me) || (S.people[S.me].updatedAt > ((snap.docs.find(x=>x.id==='p_'+S.me)||{data:()=>({})}).data().updatedAt||0)))) pushPerson(true);
        Object.values(S.ch).forEach(c=>{ if(c.createdBy === S.me && !cloud.has(c.id)) pushCh(c); });
      }
      if(touched){ saveLocal(); softRender(); }
      checkNudge();
    }, err=>syncErr(err));

    store.onSnapshot(store.collection(db,'run_logs'), snap=>{
      let touched = false;
      snap.docChanges().forEach(ch=>{
        const id = ch.doc.id;
        if(ch.type === 'removed'){ if(S.logs[id]){ delete S.logs[id]; touched = true; } return; }
        const d = ch.doc.data();
        if(JSON.stringify(S.logs[id]) !== JSON.stringify(d)){
          const isNewFromThem = !S.logs[id] && !firstLogs && d.who !== S.me;
          S.logs[id] = d; touched = true;
          if(isNewFromThem) toast(`<span style="font-size:22px">🏃</span><span><b>${P[d.who]?.name}</b> just logged ${mi(d.dist)} mi${d.loc?' at '+esc(d.loc):''}</span>`, 5000);
        }
      });
      if(!snap.metadata.fromCache){
        cloudIds = new Set(snap.docs.map(d=>d.id));
        if(firstLogs){ firstLogs = false; flushPending(); }
      }
      if(touched){ saveLocal(); softRender(); }
      if(!snap.metadata.fromCache) syncState(navigator.onLine?'on':'', navigator.onLine?'Synced':'Offline');
    }, err=>syncErr(err));
  }catch(e){ console.warn('cloud off', e); syncState('', 'Local Only'); }
}
// The original 30-day challenge (Nov 5 → Dec 4) becomes the club's first challenge so nothing is lost.
function migrateOriginal(cloud){
  if(cloud.has('ch_original') || S.ch.ch_original || LS.get('rc_migrated', false)) return;
  const start = S.cfg.start || CLUB_START, days = Math.max(7, +S.cfg.days || 30);
  const c = {id:'ch_original', name:'The Original '+days, emoji:'🔥', kind:'daily', mode:'versus', start, end: shift(start, days-1), target:'',
    rules:{minDist:0, types:[], breaksPause:true, rest:0, strikes:'', wkUnit:'runs', minTotal:0},
    stakes:'', createdBy:'oliver', accepted:{oliver:true, alexis:true}, createdAt: Date.parse(start+'T12:00:00'), updatedAt: Date.now()};
  S.ch[c.id] = c; LS.set('rc_migrated', true); saveLocal(); pushCh(c);
}
let cloudIds = new Set(), flushing = false;
async function flushPending(){
  if(!syncOn || flushing) return; flushing = true;
  try{
    pendingIds().forEach(id=>{ if(!S.logs[id]) markPending(id, false); });
    for(const l of Object.values(S.logs)){
      if(l.who !== S.me) continue;
      if(!cloudIds.has(l.id) || pendingIds().has(l.id)) await pushLog(l);
      const ph = LS.get('rc_ph_'+l.id, null);
      if(ph) await pushPhoto(l.id, ph);
    }
  } finally { flushing = false; }
}
function pendingIds(){ return new Set(LS.get('rc_pending', [])); }
function markPending(id, on){ const s = pendingIds(); on ? s.add(id) : s.delete(id); LS.set('rc_pending', [...s]); }
function holdPhoto(id, list){ if(!LS.set('rc_ph_'+id, list)) console.warn('photo not kept locally (storage full)'); }
function syncErr(err){ console.warn('sync', err); syncState('err', err && err.code==='permission-denied' ? 'Sync Blocked' : 'Not Synced · Tap'); }
function withTimeout(p, ms){ return Promise.race([p, new Promise((_,rej)=>setTimeout(()=>rej({code:'timeout'}), ms))]); }
async function pushLog(l){
  if(!syncOn) return; markPending(l.id, true);
  try{ await withTimeout(FS.setDoc(FS.doc(db,'run_logs',l.id), l), 20000); markPending(l.id, false); cloudIds.add(l.id); }
  catch(e){ syncErr(e); }
}
async function pushPhoto(id, list){
  if(!syncOn) return;
  try{ await withTimeout(FS.setDoc(FS.doc(db,'run_photos',id), {list, at:Date.now()}), 45000); try{localStorage.removeItem('rc_ph_'+id);}catch(e){} }
  catch(e){ syncErr(e); }
}
function pushPerson(keepStamp){
  if(!S.me) return;
  const me = S.people[S.me];
  if(!keepStamp) me.updatedAt = Date.now();
  saveLocal();
  if(syncOn) FS.setDoc(FS.doc(db,'run_config','p_'+S.me), JSON.parse(JSON.stringify(me))).catch(e=>syncErr(e));
}
function pushCh(c){ if(syncOn) FS.setDoc(FS.doc(db,'run_config',c.id), JSON.parse(JSON.stringify(c))).catch(e=>syncErr(e)); }
async function syncNow(manual){
  if(!syncOn){ if(manual) toast('Cloud sync couldn’t start — check your connection and reopen the app'); return; }
  syncState('', 'Syncing');
  try{ await FS.disableNetwork(db); await FS.enableNetwork(db); }catch(e){}
  await flushPending();
  if(manual) toast(pendingIds().size ? 'Some runs still haven’t synced — try again in a moment' : '✓ All Synced');
}
function delPhoto(id){ if(syncOn) FS.deleteDoc(FS.doc(db,'run_photos',id)).catch(()=>{}); }
function pushCfg(){
  S.cfg.updatedAt = Date.now(); saveLocal();
  if(syncOn) FS.setDoc(FS.doc(db,'run_config','main'), {start:S.cfg.start, updatedAt:S.cfg.updatedAt}, {merge:true}).catch(e=>syncErr(e));
}
addEventListener('online', ()=>{ if(syncOn) syncNow(false); else syncState('', 'Local Only'); });
addEventListener('offline', ()=>syncState('', 'Offline'));
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden){ softRender(); checkNudge(); if(syncOn) syncNow(false); } });

/* ============================== boot ============================== */
applyMe();
render();
if(!S.me) pickWho();
if(!window.__NO_CLOUD) initCloud();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
setTimeout(checkChEvents, 1500);
</script>
