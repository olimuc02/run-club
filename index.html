<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Run Club</title>
<meta name="theme-color" content="#0d0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Run Club">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="rc-icon-180.png">
<link rel="icon" href="rc-icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&family=Geist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#0d0d10; --bg2:#141418; --card:#19191e; --card2:#222229; --line:#2b2b33;
  --tx:#f6f5f8; --tx2:#aeacb8; --tx3:#73717d;
  --o:#ff7a2f; --o-dim:rgba(255,122,47,.13); --o-ink:#200d02;
  --a:#b48cff; --a-dim:rgba(180,140,255,.14); --a-ink:#170b2b;
  --fd:"Barlow Condensed","Arial Narrow",sans-serif; --fu:Geist,system-ui,-apple-system,sans-serif;
  --gold:#ffc53d; --red:#ff5b5b; --ice:#7cc8ff;
  --r:20px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--fu);-webkit-font-smoothing:antialiased}
body{min-height:100vh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;color:var(--tx)}
.disp{font-family:var(--fd);letter-spacing:.01em;text-transform:uppercase;font-weight:400}

/* ---------- shell ---------- */
.app{max-width:540px;margin:0 auto;padding:calc(var(--safe-t) + 14px) 16px calc(var(--safe-b) + 96px)}
header.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--o),var(--a));display:grid;place-items:center;color:#0d0d10;font-family:var(--fd);font-size:16px}
.brand .name{font-family:var(--fd);font-size:22px;line-height:1;text-transform:uppercase}
.brand .name small{display:block;font-family:var(--fu);font-size:11px;color:var(--tx3);font-weight:600;letter-spacing:.08em;margin-top:3px}
.top-r{display:flex;gap:8px;align-items:center}
.pill{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 10px;font-size:12px;color:var(--tx2);font-weight:600}
.dot{width:7px;height:7px;border-radius:50%;background:var(--tx3)}
.dot.on{background:#3ddc84;box-shadow:0 0 8px #3ddc84}.dot.err{background:var(--red)}
.me-chip{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--card);border:1px solid var(--line)}

/* ---------- tab bar ---------- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:0 0 var(--safe-b);background:var(--bg2);border-top:1px solid var(--line);border-radius:22px 22px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.35)}
nav.tabs .bar{max-width:540px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:center;height:64px;padding:0 8px}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--tx3);padding:8px 0;position:relative}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--tx)}
.tab.on svg{color:var(--me,var(--o))}
.tab .bdg{position:absolute;top:4px;right:calc(50% - 18px);width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--card)}
.fab{justify-self:center;width:62px;height:62px;border-radius:50%;margin-top:-30px;background:var(--me,var(--o));color:var(--me-ink,#000);display:grid;place-items:center;box-shadow:0 10px 30px -6px var(--me,var(--o)),0 0 0 6px var(--bg)}
.fab svg{width:28px;height:28px}
.fab:active{transform:scale(.94)}

/* ---------- views ---------- */
.view{display:none;animation:fade .25s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:26px 2px 12px;gap:10px}
.sec-h h2{margin:0;font-family:var(--fd);font-weight:400;text-transform:uppercase;font-size:20px;letter-spacing:.02em}
.sec-h a,.sec-h button,.sec-h span{font-size:13px;color:var(--tx2);font-weight:600}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:20px 18px 18px;background:var(--card);border:1px solid var(--line)}
.hero .eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--tx2);text-transform:uppercase;display:flex;justify-content:space-between}
.wkduel{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;margin:10px 0 4px;gap:8px}
.wkduel .side b{font-family:var(--fd);font-weight:400;font-size:54px;line-height:.92;display:block}
.wkduel .side small{font-size:12px;font-weight:700;color:var(--tx2)}
.wkduel .side.r{text-align:right}
.wkduel .vsx{font-family:var(--fd);color:var(--tx3);font-size:18px;padding-bottom:16px}
.crown{font-size:16px;margin-left:4px;vertical-align:8px}
.wkbar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.07);gap:3px;margin:10px 0 2px}
.wkbar i{display:block;height:100%;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.wkbar i.o{background:var(--o)}.wkbar i.a{background:var(--a)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:16px}
.wd{text-align:center}
.wd .sq{height:40px;border-radius:9px;background:rgba(255,255,255,.06);position:relative;overflow:hidden;display:grid;grid-template-rows:1fr 1fr}
.wd .sq i{display:block}
.wd .sq i.o{background:var(--o)}.wd .sq i.a{background:var(--a)}
.brk{background:repeating-linear-gradient(135deg,rgba(124,200,255,.38) 0 3px,rgba(124,200,255,.08) 3px 7px)!important}
.wd small{display:block;font-size:10.5px;font-weight:700;color:var(--tx3);margin-top:5px}
.wd.today .sq{outline:2px solid #fff;outline-offset:1px}
.wd.today small{color:var(--tx)}
.wd.future .sq{opacity:.45}
.hero-foot{display:flex;justify-content:space-between;font-size:12px;color:var(--tx3);margin-top:12px;font-weight:600;gap:8px;flex-wrap:wrap}

/* duel */
.duel{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.runner{border-radius:22px;background:var(--card);border:1px solid var(--line);padding:16px 14px 14px;position:relative;overflow:hidden}
.runner::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--c);pointer-events:none}
.runner.o,.c-o{--c:var(--o);--c-dim:var(--o-dim);--c-ink:var(--o-ink)} .runner.a,.c-a{--c:var(--a);--c-dim:var(--a-dim);--c-ink:var(--a-ink)}
.runner .who{display:flex;align-items:center;justify-content:space-between;position:relative}
.runner .who b{font-weight:800;font-size:15px}
.you{font-size:10px;font-weight:800;letter-spacing:.1em;background:var(--c,var(--o));color:var(--c-ink,#000);border-radius:6px;padding:2px 6px}
.ring{position:relative;width:118px;height:118px;margin:12px auto 8px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .n b{font-family:var(--fd);font-size:40px;line-height:1;display:block;font-weight:400}
.ring .n small{font-size:10px;color:var(--tx3);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.runner .stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;position:relative}
.runner .stats div{background:rgba(255,255,255,.04);border-radius:12px;padding:8px 9px}
.runner .stats b{display:block;font-size:17px;font-weight:800}
.runner .stats small{font-size:10.5px;color:var(--tx3);font-weight:600}
.today-st{position:relative;margin-top:10px;border-radius:12px;padding:9px 10px;font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:7px}
.today-st.done{background:var(--c);color:var(--c-ink)}
.today-st.not{background:rgba(255,255,255,.05);color:var(--tx2);border:1px dashed var(--line)}
.today-st.ice{background:rgba(124,200,255,.14);color:var(--ice);border:1px solid rgba(124,200,255,.3)}

.callout{margin-top:14px;border-radius:20px;padding:16px;display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line)}
.callout.ice{border-color:rgba(124,200,255,.35);background:linear-gradient(135deg,rgba(124,200,255,.10),var(--card) 70%)}
.callout .emo{font-size:30px}
.callout .txt{flex:1}
.callout .txt b{display:block;font-size:15px}
.callout .txt span{font-size:13px;color:var(--tx2)}
.btn{border-radius:14px;padding:12px 16px;font-weight:800;font-size:14px;background:var(--card2);border:1px solid var(--line)}
.btn.pri{background:var(--me,var(--o));color:var(--me-ink,#000);border:0}
.btn.ice{background:var(--ice);color:#06131f;border:0}
.btn.ghost{background:transparent}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:11px}
.btn.full{width:100%;padding:16px;font-size:16px}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5}
.row-btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.row-btns .btn{flex:1}

/* feed */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border-radius:99px;padding:8px 14px;font-size:13px;font-weight:700;background:var(--card);border:1px solid var(--line);color:var(--tx2)}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.post{background:var(--card);border:1px solid var(--line);border-radius:24px;margin-top:14px;overflow:hidden}
.post.o{--c:var(--o);--c-ink:var(--o-ink)} .post.a{--c:var(--a);--c-ink:var(--a-ink)}
.post-h{display:flex;align-items:center;gap:11px;padding:14px 14px 10px}
.av{width:40px;height:40px;border-radius:50%;background:var(--c);color:var(--c-ink);display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.post-h .meta{flex:1;min-width:0}
.post-h .meta b{font-size:15px}
.post-h .meta div{font-size:12.5px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.post-stats{display:grid;grid-template-columns:repeat(3,1fr);padding:4px 14px 12px}
.post-stats div small{display:block;font-size:11px;color:var(--tx3);font-weight:600;margin-bottom:1px}
.post-stats div b{font-family:var(--fd);font-weight:400;font-size:26px;line-height:1.05}
.post-stats div b i{font-style:normal;font-family:var(--fu);font-size:12px;color:var(--tx3);font-weight:600;margin-left:2px}
.post-tags{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px;align-items:center}
.tag{display:inline-flex;align-items:center;gap:4px;line-height:1.25;white-space:nowrap;font-size:12px;font-weight:700;border-radius:8px;padding:5px 9px;background:rgba(255,255,255,.06);color:var(--tx2)}
.tag.c{background:var(--c);color:var(--c-ink)}
.tag.rec{background:rgba(255,197,61,.16);color:var(--gold)}
.tag.ice{background:rgba(124,200,255,.14);color:var(--ice)}
.post-notes{padding:0 14px 12px;font-size:14.5px;line-height:1.5;color:#dfe1e8;white-space:pre-wrap;word-wrap:break-word}
.post-photo.ph{width:100%;aspect-ratio:4/3;background:var(--card2);display:grid;place-items:center;color:var(--tx3);font-size:13px}
.gal{position:relative}
.gal-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.gal-track::-webkit-scrollbar{display:none}
.gal-track img{flex:none;width:100%;aspect-ratio:4/3;object-fit:cover;scroll-snap-align:center;display:block;background:var(--card2)}
.gal-n{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-weight:700;border-radius:99px;padding:4px 9px}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.thumbs .th{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--card)}
.thumbs .th img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs .th .x{position:absolute;top:5px;right:5px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;font-size:13px;display:grid;place-items:center}
.thumbs .add{aspect-ratio:1;border:1.5px dashed var(--line);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--tx2);font-size:12px;font-weight:700}
.thumbs .add svg{width:24px;height:24px;color:var(--tx3)}
.post-actions{display:flex;align-items:center;gap:6px;padding:10px 12px;border-top:1px solid var(--line);flex-wrap:wrap}
.react{border-radius:99px;padding:6px 10px;font-size:14px;background:rgba(255,255,255,.05);border:1px solid transparent;display:flex;align-items:center;gap:4px;font-weight:700}
.react small{font-size:11.5px;color:var(--tx2)}
.react.mine{border-color:var(--me,var(--o));background:rgba(255,255,255,.09)}
.more{padding:6px 8px;color:var(--tx3)}
.comments{padding:0 14px 12px}
.cmt{font-size:13.5px;margin-top:8px;line-height:1.4}
.cmt b{margin-right:6px}
.cmt b.o{color:var(--o)} .cmt b.a{color:var(--a)}
.cmt span{color:#d5d7df}
.cmt-in{display:flex;gap:8px;margin-top:10px}
.cmt-in input{flex:1;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;outline:none}
.cmt-in button{font-weight:800;font-size:13px;color:var(--me,var(--o));padding:0 6px}
.empty{text-align:center;color:var(--tx3);padding:50px 20px;font-size:14px}
.empty b{display:block;font-size:40px;margin-bottom:8px}
.brkpost{margin-top:14px;border-radius:20px;padding:14px;display:flex;gap:12px;align-items:center;background:rgba(124,200,255,.06);border:1px dashed rgba(124,200,255,.35)}
.brkpost .e{font-size:26px}
.brkpost .t{flex:1;font-size:13.5px;color:var(--tx2);line-height:1.4}
.brkpost .t b{color:var(--tx)}

/* calendar */
.mcal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mcal-h b{font-family:var(--fd);font-weight:400;font-size:20px;text-transform:uppercase}
.mcal-h button{width:36px;height:36px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:16px}
.mcal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.mcal .dn{font-size:10.5px;color:var(--tx3);font-weight:700;text-align:center;padding-bottom:2px}
.cell{aspect-ratio:1/1.1;border-radius:12px;background:var(--card);border:1px solid var(--line);position:relative;overflow:hidden;padding:5px 6px;text-align:left}
.cell .d{font-size:12px;font-weight:800;position:relative;z-index:2}
.cell .halves{position:absolute;inset:0;display:grid;grid-template-rows:1fr 1fr;z-index:1}
.cell .halves i.o.on{background:linear-gradient(180deg,var(--o),rgba(255,122,47,.6))}
.cell .halves i.a.on{background:linear-gradient(0deg,var(--a),rgba(180,140,255,.6))}
.cell.ho .d{color:#0d0d10}
.cell.today{outline:2px solid #fff;outline-offset:1px}
.cell.future{opacity:.38}
.cell.out{visibility:hidden}
.cell .star{position:absolute;bottom:3px;right:4px;z-index:2;font-size:10px}
.legend{display:flex;gap:14px;justify-content:center;margin:14px 0 4px;font-size:12px;color:var(--tx2);font-weight:600;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}

/* stats */
.box{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px 16px}
.h2h{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:6px 16px}
.h2h-row{padding:13px 0;border-bottom:1px solid var(--line)}
.h2h-row:last-child{border:0}
.h2h-row .lbl{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--tx3);font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin-bottom:7px}
.h2h-row .lbl b{font-family:var(--fd);font-weight:400;font-size:19px;color:var(--tx);letter-spacing:0;text-transform:none}
.h2h-row .lbl b.win::after{content:"★";font-family:var(--fu);font-size:11px;color:var(--gold);position:relative;top:-6px;margin-left:3px}
.h2h-row .lbl em{font-style:normal;text-align:center}
.vs{display:flex;height:9px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.06);gap:3px}
.vs i{display:block;height:100%;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.vs i.o{background:var(--o);border-radius:99px 0 0 99px}.vs i.a{background:var(--a);border-radius:0 99px 99px 0}
.chartbox{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px 10px 8px}
.chartbox svg{width:100%;height:auto;display:block}
#map{height:300px;border-radius:22px;border:1px solid var(--line);overflow:hidden;background:var(--card);z-index:1}
.prs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prcol h4{margin:0 0 8px;font-size:13px;font-weight:800;display:flex;align-items:center;gap:6px}
.prcol h4 i{width:10px;height:10px;border-radius:50%;display:inline-block}
.pr{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 11px;margin-bottom:7px}
.pr small{display:block;font-size:10.5px;color:var(--tx3);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.pr b{font-family:var(--fd);font-weight:400;font-size:21px}
.pr span{font-size:11px;color:var(--tx3);font-weight:600;margin-left:4px}
.goal{display:flex;align-items:center;gap:14px;padding:6px 0}
.goal+.goal{border-top:1px solid var(--line);padding-top:12px;margin-top:6px}
.goal .gr{width:64px;height:64px;position:relative;flex:none}
.goal .gr svg{width:100%;height:100%;transform:rotate(-90deg)}
.goal .gr b{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:800}
.goal .gt{flex:1;font-size:13px;color:var(--tx2);line-height:1.45}
.goal .gt b{color:var(--tx);font-size:15px;display:block}
.shoe{display:flex;align-items:center;gap:10px;padding:9px 0}
.shoe+.shoe{border-top:1px solid var(--line)}
.shoe .sn{flex:1;font-size:14px;font-weight:700}
.shoe .sn small{display:block;font-size:11.5px;color:var(--tx3);font-weight:600;margin-top:2px}
.shoe .sb{height:5px;border-radius:9px;background:rgba(255,255,255,.07);margin-top:6px;overflow:hidden}
.shoe .sb i{display:block;height:100%;border-radius:9px}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.badge{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 8px 10px;text-align:center}
.badge .e{font-size:28px;filter:grayscale(1) opacity(.35)}
.badge b{display:block;font-size:12px;margin-top:5px}
.badge small{display:block;font-size:10.5px;color:var(--tx3);margin-top:2px;line-height:1.3}
.badge .got{display:flex;justify-content:center;gap:4px;margin-top:7px;min-height:14px}
.badge .got i{width:14px;height:14px;border-radius:50%;font-size:8.5px;font-style:normal;font-weight:800;display:grid;place-items:center}
.badge .got i.o{background:var(--o);color:var(--o-ink)}.badge .got i.a{background:var(--a);color:var(--a-ink)}
.badge.earned .e{filter:none}
.badge.earned{border-color:rgba(255,197,61,.35);background:linear-gradient(180deg,rgba(255,197,61,.08),var(--card) 60%)}

/* challenges */
.trophies{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px 18px}
.trophies .t{font-family:var(--fd);font-size:40px;line-height:1}
.trophies .t small{display:block;font-family:var(--fu);font-size:11.5px;font-weight:700;color:var(--tx3);margin-top:3px}
.trophies .mid{text-align:center;font-size:26px}
.trophies .mid small{display:block;font-size:10.5px;color:var(--tx3);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.ch{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px;margin-top:14px;position:relative;overflow:hidden}
.ch.invite{border-color:var(--gold);box-shadow:0 0 0 1px rgba(255,197,61,.25) inset}
.ch.done{background:linear-gradient(180deg,rgba(255,197,61,.07),var(--card) 55%)}
.ch-h{display:flex;gap:12px;align-items:flex-start}
.ch-h .e{font-size:30px;line-height:1;width:48px;height:48px;border-radius:15px;background:var(--card2);display:grid;place-items:center;flex:none}
.ch-h .tt{flex:1;min-width:0}
.ch-h .tt b{display:block;font-size:17px;font-weight:800;line-height:1.2}
.ch-h .tt small{display:block;font-size:12.5px;color:var(--tx3);font-weight:600;margin-top:3px}
.ch .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ch .timebar{height:4px;border-radius:9px;background:rgba(255,255,255,.07);margin-top:12px;overflow:hidden}
.ch .timebar i{display:block;height:100%;background:var(--tx2);border-radius:9px}
.stand{margin-top:14px}
.srow{display:flex;align-items:center;gap:10px;margin-top:10px}
.srow .av{width:32px;height:32px;font-size:13px}
.srow .sbody{flex:1;min-width:0}
.srow .stop{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.srow .stop b{font-family:var(--fd);font-weight:400;font-size:22px}
.srow .stop small{font-size:12px;color:var(--tx3);font-weight:600;text-align:right}
.srow .sbar{height:7px;border-radius:9px;background:rgba(255,255,255,.07);margin-top:4px;overflow:hidden}
.srow .sbar i{display:block;height:100%;border-radius:9px;background:var(--c);transition:width .7s cubic-bezier(.2,.8,.2,1)}
.srow.out{opacity:.45}
.srow .lead{font-size:13px;margin-left:4px}
.teambar{height:12px;border-radius:9px;background:rgba(255,255,255,.07);margin-top:8px;overflow:hidden;display:flex}
.teambar i{display:block;height:100%}
.teambar i.o{background:var(--o)}.teambar i.a{background:var(--a)}
.rules{margin:12px 0 0;padding:0;list-style:none;font-size:12.5px;color:var(--tx2);line-height:1.5}
.rules li::before{content:"· ";color:var(--tx3)}
.stakes{margin-top:12px;border-radius:14px;padding:10px 12px;background:rgba(255,197,61,.08);border:1px solid rgba(255,197,61,.22);font-size:13.5px;font-weight:600;color:#ffe2a0}
.result{margin-top:14px;border-radius:16px;padding:12px 14px;font-weight:800;font-size:15px;display:flex;gap:10px;align-items:center;background:var(--card2)}
.result .e{font-size:24px}
.tpl{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.tpl button{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:left;font-size:13.5px;font-weight:800;display:flex;gap:9px;align-items:center}
.tpl button span{font-size:22px}
.tpl button small{display:block;font-size:11px;color:var(--tx3);font-weight:600;margin-top:2px}
.kinds{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kinds button{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:11px 12px;text-align:left}
.kinds button b{display:block;font-size:14px}
.kinds button small{display:block;font-size:11.5px;color:var(--tx3);font-weight:600;line-height:1.35;margin-top:3px}
.kinds button.on{border-color:var(--me,var(--o));background:rgba(255,255,255,.07)}
.emojis{display:flex;gap:6px;flex-wrap:wrap}
.emojis button{width:42px;height:42px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);font-size:21px}
.emojis button.on{border-color:var(--me,var(--o));background:rgba(255,255,255,.08)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.toggle span{font-size:14px;font-weight:600}
.toggle span small{display:block;font-size:12px;color:var(--tx3);font-weight:500;margin-top:2px}
.sw{width:50px;height:30px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:var(--me,var(--o))}
.sw.on::after{transform:translateX(20px)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;opacity:0;pointer-events:none;transition:opacity .25s;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:540px;margin:0 auto;background:var(--bg2);border-radius:28px 28px 0 0;border:1px solid var(--line);border-bottom:0;max-height:92vh;overflow-y:auto;transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.9,.2,1);padding:10px 18px calc(var(--safe-b) + 22px);-webkit-overflow-scrolling:touch}
.sheet.on{transform:none}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet h3{font-family:var(--fd);font-weight:400;text-transform:uppercase;font-size:26px;margin:4px 0 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet h3 button{font-family:var(--fu);font-size:14px;color:var(--tx2);font-weight:600;text-transform:none;flex:none}
.fld{margin-bottom:16px}
.fld>label,.lab{display:block;font-size:12px;font-weight:700;color:var(--tx3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:7px}
.in{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
.in:focus{border-color:var(--me,var(--o))}
textarea.in{min-height:90px;resize:vertical;line-height:1.45}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.row2>*{min-width:0}
input[type=date].in,input[type=time].in{min-width:0;max-width:100%;display:block}
.bigin{display:flex;align-items:baseline;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 16px}
.bigin input{background:none;border:0;outline:none;font-family:var(--fd);font-size:46px;width:100%;min-width:0;padding:0}
.bigin span{color:var(--tx3);font-weight:700}
.dur{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dur div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 10px}
.dur input{width:100%;background:none;border:0;outline:none;font-family:var(--fd);font-size:28px;padding:0}
.dur small{font-size:11px;color:var(--tx3);font-weight:700}
.pace-live{margin-top:8px;font-size:13px;color:var(--tx2);font-weight:600}
.pace-live b{color:var(--me,var(--o))}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border-radius:12px;padding:9px 12px;font-size:14px;font-weight:700;background:var(--card);border:1px solid var(--line);color:var(--tx2)}
.opt.on{background:var(--me,var(--o));color:var(--me-ink,#000);border-color:transparent}
.opt.ice.on{background:var(--ice);color:#06131f}
.feel{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.feel button{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 0 7px;font-size:26px;display:flex;flex-direction:column;align-items:center;gap:2px}
.feel button small{font-size:10px;color:var(--tx3);font-weight:700}
.feel button.on{border-color:var(--me,var(--o));background:rgba(255,255,255,.08)}
.loc-row{display:flex;gap:8px}
.loc-row .in{flex:1}
.loc-row button{flex:none;width:50px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center}
.loc-row button svg{width:20px;height:20px;color:var(--me,var(--o))}
.drop{border:1.5px dashed var(--line);border-radius:18px;padding:22px;text-align:center;color:var(--tx2);font-size:14px;font-weight:600;display:block;cursor:pointer}
.drop svg{width:28px;height:28px;display:block;margin:0 auto 6px;color:var(--tx3)}
.hint{font-size:12px;color:var(--tx3);margin-top:6px}

.who-pick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.who-pick button{border-radius:22px;padding:22px 10px;font-weight:800;font-size:18px;display:flex;flex-direction:column;align-items:center;gap:10px;border:2px solid var(--line);background:var(--card)}
.who-pick button .av{width:64px;height:64px;font-size:26px}
.who-pick button.o .av{background:var(--o);color:var(--o-ink)} .who-pick button.a .av{background:var(--a);color:var(--a-ink)}

.toast{position:fixed;left:50%;top:calc(var(--safe-t) + 14px);transform:translate(-50%,-150%);z-index:80;background:var(--tx);color:var(--bg);font-weight:700;font-size:14px;border-radius:16px;padding:12px 16px;max-width:calc(100% - 32px);box-shadow:0 12px 30px rgba(0,0,0,.5);transition:transform .35s cubic-bezier(.2,.9,.2,1);display:flex;gap:10px;align-items:center}
.toast.on{transform:translate(-50%,0)}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:90;width:100%;height:100%}
.celebrate{text-align:center;padding:10px 4px 6px}
.celebrate .e{font-size:70px;line-height:1;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.2) rotate(-20deg)}to{transform:none}}
.celebrate h4{font-family:var(--fd);font-weight:400;font-size:32px;text-transform:uppercase;margin:12px 0 6px;line-height:1}
.celebrate p{color:var(--tx2);margin:0 0 18px;font-size:15px;line-height:1.45}
.celebrate .prl{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:-6px 0 16px}
.leaflet-container{background:#111318;font-family:var(--fu)}
#map .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9) saturate(.6)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--card2);color:var(--tx)}
.leaflet-popup-content{margin:10px 12px;font-size:13px}
.pin{width:16px;height:16px;border-radius:50%;border:3px solid #0d0d10;box-shadow:0 0 0 2px rgba(255,255,255,.3)}
.small-note{font-size:12.5px;color:var(--tx3);line-height:1.5;margin-top:4px}
.danger{color:var(--red)}
.quote{margin-top:14px;padding:16px 18px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-size:15px;line-height:1.45;color:#dfe1e8;font-weight:500}
.quote b{display:block;font-size:11px;color:var(--tx3);letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px}
.list-item{display:flex;align-items:center;gap:10px;padding:10px 0;font-size:14px}
.list-item+.list-item{border-top:1px solid var(--line)}
.list-item .grow{flex:1;min-width:0}
.list-item small{display:block;font-size:12px;color:var(--tx3);margin-top:2px}

/* ---------- 2.1 look: condensed italic numbers, Geist text, calmer surfaces ---------- */
.topveil{position:fixed;top:0;left:0;right:0;height:var(--safe-t);background:var(--bg);z-index:45}
.topveil::after{content:"";position:absolute;left:0;right:0;top:100%;height:14px;background:linear-gradient(var(--bg),transparent)}
body{letter-spacing:-.005em}
.brand .name,.sec-h h2,.sheet h3,.celebrate h4,.mcal-h b{font-weight:800;letter-spacing:.01em}
.brand .name{font-size:24px}
.sec-h h2{font-size:22px}
.sheet h3{font-size:30px}
.wkduel .side b,.ring .n b,.post-stats div b,.srow .stop b,.trophies .t,.pr b,.h2h-row .lbl b,.bigin input,.dur input,.cell .d{font-family:var(--fd);font-style:italic;font-weight:800;letter-spacing:-.01em}
.wkduel .side b{font-size:64px}
.wkduel .vsx{font-family:var(--fd);font-style:italic;font-weight:800;color:var(--tx3);font-size:20px;padding-bottom:18px}
.ring .n b{font-size:46px}
.ring .n small{font-size:10.5px;letter-spacing:.06em}
.post-stats div b{font-size:30px}
.srow .stop b{font-size:24px}
.trophies .t{font-size:46px}
.pr b{font-size:24px}
.h2h-row .lbl b{font-size:22px}
.cell .d{font-size:14px}
.hero .eyebrow,.fld>label,.lab,.quote b{letter-spacing:.1em}
.btn{font-weight:700;letter-spacing:.005em}
.btn.pri,.fab{box-shadow:none}
.fab{box-shadow:0 8px 24px -8px var(--me,var(--o)),0 0 0 6px var(--bg2)}
.ring svg circle:last-child{filter:none!important}
.runner .stats b{font-size:18px}
.runner .stats small{white-space:nowrap;display:block}
.post-tags .tag,.ch .meta .tag,.prl .tag{height:30px;padding:0 11px;font-size:12.5px;border-radius:9px;box-sizing:border-box;line-height:1;border:0}
.tag .ti{font-size:13px;line-height:1}
.wd .sq{border-radius:10px}
.chip.on{background:var(--me,var(--tx));color:var(--me-ink,var(--bg));border-color:transparent}
.post,.ch,.runner,.hero,.h2h,.box,.chartbox,.trophies,.callout,.quote{border-color:var(--line)}
.ch.invite{border-color:var(--me,var(--gold))}
</style>
</head>
<body>
<div class="topveil"></div>
<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <div class="logo">RC</div>
      <div class="name">Run Club<small>Oliver × Alexis</small></div>
    </div>
    <div class="top-r">
      <div class="pill" id="syncPill" onclick="syncNow(true)" style="cursor:pointer"><span class="dot"></span><span id="syncTxt">Local</span></div>
      <button class="me-chip" id="meChip" aria-label="Settings"></button>
    </div>
  </header>
  <section class="view on" id="v-home"></section>
  <section class="view" id="v-feed"></section>
  <section class="view" id="v-ch"></section>
  <section class="view" id="v-stats"></section>
</div>

<nav class="tabs"><div class="bar">
  <button class="tab on" data-v="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
  <button class="tab" data-v="feed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg>Feed</button>
  <button class="fab" id="fab" aria-label="Log a run"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="tab" data-v="ch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>Challenges</button>
  <button class="tab" data-v="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Stats</button>
</div></nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>
<canvas id="fx"></canvas>
<input type="file" id="photoIn" accept="image/*" multiple hidden>

<script>

/* ============================== dates ============================== */
const pad = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());

const sumMi = ls => ls.reduce((s,l)=>s+(+l.dist||0),0);

const fmtPace = s => { if(!s || !isFinite(s)) return '–'; s = Math.round(s); return Math.floor(s/60)+':'+pad(s%60); };
const fmtDur = s => { s = Math.round(s||0); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60; return h ? h+':'+pad(m)+':'+pad(x) : m+':'+pad(x); };
const fmtHrs = s => { const h = s/3600; return h >= 1 ? h.toFixed(1)+'h' : Math.round(s/60)+'m'; };

/* ============================== streaks + goals ============================== */
// A day counts if you ran. Break days are frozen: they don't add to the streak and don't end it.
function curStreak(who){
  let d = today(), n = 0, g = 0;
  if(!ranOn(who, d)) d = shift(d,-1);
  while(g++ < 4000 && d >= clubStart()){
    if(ranOn(who, d)) n++; else if(!breakOn(who, d)) break;
    d = shift(d,-1);
  }
  return n;
}
function bestStreak(who){
  let best = 0, cur = 0;
  range(clubStart(), today()).forEach(d=>{
    if(ranOn(who,d)){ cur++; best = Math.max(best,cur); }
    else if(!breakOn(who,d) && d !== today()) cur = 0;
  });
  return best;
}
function togetherStreak(){
  let d = today(), n = 0, g = 0;
  if(!(ranOn('oliver',d) && ranOn('alexis',d))) d = shift(d,-1);
  while(g++ < 4000 && d >= clubStart()){
    const o = ranOn('oliver',d), a = ranOn('alexis',d);
    if(o && a) n++;
    else if(!((o || breakOn('oliver',d)) && (a || breakOn('alexis',d)))) break;
    d = shift(d,-1);
  }
  return n;
}
const weekGoal = who => +((S.people[who].goal||{}).week) || 3;
const yearGoal = who => +((S.people[who].goal||{}).year) || 0;
function weekRuns(who, ws){ return logsIn(who, ws, shift(ws,6)).length; }
function weekBreakDays(who, ws){ return range(ws, shift(ws,6)).filter(d=>breakOn(who,d)).length; }
// weeks in a row hitting your weekly goal; a mostly-on-break week is skipped, not failed
function weekStreak(who){
  let ws = weekStart(today()), n = 0, g = 0;
  if(weekRuns(who, ws) >= weekGoal(who)) n++;
  ws = shift(ws,-7);
  while(g++ < 600 && shift(ws,6) >= clubStart()){
    if(weekRuns(who, ws) >= weekGoal(who)) n++;
    else if(weekBreakDays(who, ws) < 4) break;
    ws = shift(ws,-7);
  }
  return n;
}
function bestWeekStreak(who){
  let best = 0, cur = 0;
  for(let ws = weekStart(clubStart()); ws <= weekStart(today()); ws = shift(ws,7)){
    const cw = ws === weekStart(today());
    if(weekRuns(who, ws) >= weekGoal(who)){ cur++; best = Math.max(best,cur); }
    else if(!cw && weekBreakDays(who, ws) < 4) cur = 0;
  }
  return best;
}
// each finished week, whoever ran more miles wins it
function weekWins(){
  const w = {oliver:0, alexis:0, ties:0, list:[]};
  for(let ws = weekStart(clubStart()); ws < weekStart(today()); ws = shift(ws,7)){
    const o = sumMi(logsIn('oliver', ws, shift(ws,6))), a = sumMi(logsIn('alexis', ws, shift(ws,6)));
    if(!o && !a) continue;
    const win = Math.abs(o-a) < .005 ? null : (o > a ? 'oliver' : 'alexis');
    if(win) w[win]++; else w.ties++;
    w.list.push({ws, o, a, win});
  }
  return w;
}

/* ============================== records ============================== */
function records(who, skipId){
  const ls = logsOf(who).filter(l => l.id !== skipId);
  const r = {long:null, pace:null, fivek:null, tenk:null, week:null, month:null};
  ls.forEach(l=>{
    const d = +l.dist||0, p = (l.secs && d) ? l.secs/d : 0;
    if(d && (!r.long || d > r.long.v)) r.long = {v:d, id:l.id, date:l.date};
    if(d >= 1 && p && (!r.pace || p < r.pace.v)) r.pace = {v:p, id:l.id, date:l.date};
    if(d >= 3.1 && p && (!r.fivek || p < r.fivek.v)) r.fivek = {v:p, id:l.id, date:l.date};
    if(d >= 6.2 && p && (!r.tenk || p < r.tenk.v)) r.tenk = {v:p, id:l.id, date:l.date};
  });
  const wk = {}, mo = {};
  ls.forEach(l=>{ const w = weekStart(l.date), m = l.date.slice(0,7); wk[w] = (wk[w]||0) + (+l.dist||0); mo[m] = (mo[m]||0) + (+l.dist||0); });
  Object.entries(wk).forEach(([k,v])=>{ if(!r.week || v > r.week.v) r.week = {v, key:k}; });
  Object.entries(mo).forEach(([k,v])=>{ if(!r.month || v > r.month.v) r.month = {v, key:k}; });
  return r;
}
let REC = null;
function recNow(){ if(!REC) REC = {oliver:records('oliver'), alexis:records('alexis')}; return REC; }
function prTags(l){

  if(r.pace && r.pace.id === l.id) t.push('⚡ Fastest Pace');
  if(r.fivek && r.fivek.id === l.id && !(r.pace && r.pace.id === l.id)) t.push('🥇 Best 5K+ Pace');
  return t;
}
function newPRs(who, id){
  const b = records(who, id), a = records(who), out = [];
  if(a.long && a.long.id === id && (!b.long || a.long.v > b.long.v)) out.push('🏆 Longest Run Ever');
  if(a.pace && a.pace.id === id && (!b.pace || a.pace.v < b.pace.v) && b.pace) out.push('⚡ Fastest Pace Ever');
  if(a.fivek && a.fivek.id === id && b.fivek && a.fivek.v < b.fivek.v) out.push('🥇 Best 5K+ Pace');
  if(a.week && b.week && a.week.v > b.week.v && a.week.key === weekStart(S.logs[id].date)) out.push('📈 Biggest Week');
  return out;
}

/* ============================== challenges engine ============================== */
const chList = () => Object.values(S.ch).filter(c => c && c.id && !c.declined);
const chLast = c => { const t = today(); return (c.end && c.end < t) ? c.end : t; };   // last day counted so far
function qRuns(c, who){
  const r = c.rules || {}, to = chLast(c);
  return logsOf(who).filter(l => l.date >= c.start && l.date <= to
    && (+l.dist||0) >= (+r.minDist||0)
    && (!r.types || !r.types.length || r.types.includes(l.type)));
}
const excused = (c, who, d) => (c.rules||{}).breaksPause !== false && !!breakOn(who, d);
const strikesOf = c => { const s = (c.rules||{}).strikes; return (s===null || s===undefined || s==='') ? null : +s; };
// days missed (after weekly rest-day allowance), excluding today while it's still open
function missDays(c, who){
  const hit = new Set(qRuns(c, who).map(l=>l.date)), t = today(), rest = +((c.rules||{}).rest||0), wk = {}, out = [];
  range(c.start, chLast(c)).forEach(d=>{
    if(hit.has(d) || d === t || excused(c, who, d)) return;
    const w = weekStart(d); wk[w] = (wk[w]||0) + 1;
    if(wk[w] > rest) out.push(d);
  });
  return {hit, miss:out};
}
function weeklyTally(c, who){
  const unit = (c.rules||{}).wkUnit || 'runs', tgt = +c.target || 1, rs = qRuns(c, who), last = chLast(c), t = today();
  const weeks = [];
  for(let ws = weekStart(c.start); ws <= last; ws = shift(ws,7)){
    const we = shift(ws,6), from = ws < c.start ? c.start : ws, endCap = c.end && c.end < we ? c.end : we, to = endCap > last ? last : endCap;
    const len = diffDays(from, endCap) + 1, need = len >= 7 ? tgt : Math.max(1, Math.ceil(tgt*len/7*10)/10);
    const inW = rs.filter(l => l.date >= from && l.date <= to);
    const v = unit === 'miles' ? sumMi(inW) : inW.length;
    const closed = endCap < t, done = v >= need;
    const brk = range(from, endCap).filter(d=>excused(c, who, d)).length;
    weeks.push({ws, v, need, done, closed, excused: !done && brk >= Math.ceil(len/2), end:endCap});
  }
  return weeks;
}
function chStatus(c){
  if(c.endedAt) return 'finished';
  if(c.start > today()) return 'upcoming';
  const R = chResult(c);
  if(R.decided) return 'finished';
  if(c.end && c.end < today()) return 'finished';
  return 'active';
}
// standings for any challenge: rows (per person), team totals, leader/winner
function chResult(c){
  const k = c.kind, team = c.mode === 'team', tgt = +c.target || 0, strikes = strikesOf(c);
  const R = {rows:{}, decided:false, winner:null, teamWon:null, leader:null};
  const better = (x, y) => k === 'pace' ? (x.v && (!y.v || x.v < y.v)) : x.v > y.v;
  WHO.forEach(w=>{
    const rs = qRuns(c, w), row = {who:w, v:0, disp:'', sub:'', pct:0, out:null};
    if(k === 'daily'){
      const m = missDays(c, w);
      row.v = m.hit.size; row.miss = m.miss.length; row.disp = plural(row.v,'day');
      row.sub = row.miss ? plural(row.miss,'miss').replace('misss','misses') : 'No misses';
      if(strikes !== null){ if(row.miss > strikes) row.out = m.miss[strikes]; else row.sub += ' · '+(strikes-row.miss)+' left'; }
      row.today = m.hit.has(today());
    } else if(k === 'weekly'){
      const wk = weeklyTally(c, w), fails = wk.filter(x=>x.closed && !x.done && !x.excused);
      row.v = wk.filter(x=>x.done).length; row.miss = fails.length; row.weeks = wk;
      const cur = wk[wk.length-1], u = (c.rules||{}).wkUnit === 'miles' ? 'mi' : 'runs';
      row.disp = plural(row.v,'week');
      row.sub = cur ? 'This week '+(u==='mi'?mi1(cur.v):cur.v)+'/'+cur.need+' '+u : '';
      if(strikes !== null && row.miss > strikes) row.out = fails[strikes].end;
    } else if(k === 'miles' || k === 'race'){
      row.v = sumMi(rs); row.disp = mi1(row.v)+' mi';
      if(k === 'race' && tgt){
        let cum = 0; const sorted = rs.slice().sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));
        for(const l of sorted){ cum += +l.dist||0; if(cum >= tgt){ row.reached = l.date+(l.time||''); break; } }
        row.sub = row.reached ? 'Hit '+tgt+' mi on '+fmtDate(row.reached.slice(0,10)) : mi1(Math.max(0,tgt-row.v))+' mi to go';
      } else row.sub = plural(rs.length,'run');
    } else if(k === 'runs'){
      row.v = rs.length; row.disp = plural(row.v,'run'); row.sub = mi1(sumMi(rs))+' mi';
    } else if(k === 'long'){
      const best = rs.reduce((m,l)=>(+l.dist||0) > (m?+m.dist:0) ? l : m, null);
      row.v = best ? +best.dist : 0; row.disp = mi(row.v)+' mi'; row.sub = best ? fmtDate(best.date)+(best.loc?' · '+best.loc:'') : 'No runs yet';
    } else if(k === 'pace'){
      const need = +((c.rules||{}).minTotal||0), tot = sumMi(rs.filter(l=>l.secs>0));
      row.v = paceOf(rs); row.disp = row.v ? fmtPace(row.v)+' /mi' : '–';
      row.sub = mi1(tot)+' mi timed'; if(need && tot < need){ row.short = true; row.sub += ' · needs '+mi1(need-tot)+' more'; }
    }
    R.rows[w] = row;
  });
  const o = R.rows.oliver, a = R.rows.alexis;
  if(team){
    if(k === 'daily'){
      const mo = new Set(missDays(c,'oliver').miss), ma = new Set(missDays(c,'alexis').miss);
      const both = range(c.start, chLast(c)).filter(d => ranOnQ(c,'oliver',d) && ranOnQ(c,'alexis',d)).length;
      const miss = [...new Set([...mo, ...ma])].sort();
      R.team = {v:both, disp:plural(both,'day')+' together', sub: miss.length ? plural(miss.length,'missed day') : 'No missed days'};
      if(strikes !== null && miss.length > strikes){ R.decided = true; R.teamWon = false; R.team.out = miss[strikes]; }
    } else if(k === 'weekly'){
      const wo = o.weeks, wa = a.weeks;
      const done = wo.filter((x,i)=>x.done && wa[i] && wa[i].done).length;
      const fails = wo.filter((x,i)=>x.closed && !(x.done || x.excused) || (wa[i] && wa[i].closed && !(wa[i].done || wa[i].excused))).length;
      R.team = {v:done, disp:plural(done,'week')+' both hit', sub: fails ? plural(fails,'missed week') : 'No missed weeks'};
      if(strikes !== null && fails > strikes){ R.decided = true; R.teamWon = false; }
    } else {
      const tot = o.v + a.v; R.team = {v:tot, disp:(k==='miles'?mi1(tot)+' mi':plural(tot,'run')), pct: tgt ? tot/tgt : 0};
      R.team.sub = tgt ? (tot >= tgt ? 'Goal reached!' : (k==='miles'?mi1(tgt-tot)+' mi':plural(Math.ceil(tgt-tot),'run'))+' to go') : '';
      if(tgt && tot >= tgt){ R.decided = true; R.teamWon = true; }
    }
    if(!R.decided && c.end && c.end < today()) R.teamWon = (k==='daily'||k==='weekly') ? true : (tgt ? R.team.v >= tgt : true);
    if(R.decided || (c.end && c.end < today())) R.decided = true;
    return R;
  }
  // versus
  if(k === 'race'){
    if(o.reached || a.reached){
      R.decided = true;
      R.winner = !a.reached ? 'oliver' : !o.reached ? 'alexis' : (o.reached < a.reached ? 'oliver' : o.reached > a.reached ? 'alexis' : 'tie');
    }
  }
  if((k === 'daily' || k === 'weekly') && strikes !== null && (o.out || a.out)){
    R.decided = true;
    R.winner = !a.out ? 'oliver' : !o.out ? 'alexis' : (o.out > a.out ? 'oliver' : o.out < a.out ? 'alexis' : 'tie');
  }
  // current leader
  if(k === 'daily' || k === 'weekly'){
    R.leader = o.miss !== a.miss ? (o.miss < a.miss ? 'oliver' : 'alexis') : (o.v !== a.v ? (o.v > a.v ? 'oliver' : 'alexis') : null);
  } else if(k === 'pace'){
    const oq = o.v && !o.short, aq = a.v && !a.short;
    R.leader = oq && aq ? (o.v < a.v ? 'oliver' : o.v > a.v ? 'alexis' : null) : oq ? 'oliver' : aq ? 'alexis' : null;
  } else R.leader = Math.abs(o.v - a.v) < .005 ? null : (o.v > a.v ? 'oliver' : 'alexis');
  if(!R.decided && c.end && c.end < today()){ R.decided = true; R.winner = R.leader || 'tie'; }
  if(c.endedAt && !R.decided){ R.decided = true; R.winner = R.leader || 'tie'; }
  return R;
}
const ranOnQ = (c, who, d) => qRuns(c, who).some(l => l.date === d);
function chWins(){
  const w = {oliver:0, alexis:0, team:0};
  chList().forEach(c=>{
    if(chStatus(c) !== 'finished') return;
    const R = chResult(c);
    if(c.mode === 'team'){ if(R.teamWon) w.team++; }
    else if(R.winner === 'oliver' || R.winner === 'alexis') w[R.winner]++;
  });
  return w;
}
const pendingInvites = () => S.me ? chList().filter(c => c.createdBy !== S.me && !(c.accepted||{})[S.me] && chStatus(c) !== 'finished') : [];

/* ============================== badges ============================== */
function earned(who){
  const ls = logsOf(who), set = new Set();
  if(ls.length) set.add('first');
  const b = bestStreak(who);
  if(b>=3) set.add('s3'); if(b>=7) set.add('s7'); if(b>=14) set.add('s14'); if(b>=30) set.add('s30'); if(b>=100) set.add('s100');
  if(bestWeekStreak(who) >= 4) set.add('w4');
  const t = sumMi(ls);
  if(t>=26.2) set.add('mara'); if(t>=100) set.add('c100'); if(t>=500) set.add('c500');
  const places = new Set();
  ls.forEach(l=>{
    if(+l.dist>=6.2) set.add('10k'); if(+l.dist>=13.1) set.add('hm');
    if(+l.dist>=1 && l.secs && l.secs/l.dist < 480) set.add('speed');
    if(l.time){ const h = +l.time.split(':')[0]; if(h<7) set.add('early'); if(h>=20) set.add('owl'); }
    if(l.together) set.add('together');
    if(l.loc) places.add(l.loc.toLowerCase().split(',')[0].trim());
  });
  if(places.size >= 5) set.add('explore');
  if(breaksOf(who).some(br => br.to && ranOn(who, shift(br.to,1)))) set.add('comeback');
  if(chWins()[who] > 0) set.add('champ');
  if(weekWins()[who] >= 5) set.add('wk5');
  return set;
}

  <circle cx="60" cy="60" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-Math.max(0,Math.min(1,pct)))}" style="transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 6px ${color}66)"/></svg>`;
}
function callout(e,title,txt,btn,cls=''){ return `<div class="callout ${cls}"><div class="emo">${e}</div><div class="txt"><b>${title}</b><span>${txt}</span></div>${btn}</div>`; }

/* ============================== render: home ============================== */
function runnerCard(who){
  const p = P[who], t = today(), ws = weekStart(t), todays = IDX[who][t] || [];
  const wr = weekRuns(who, ws), goal = weekGoal(who), st = curStreak(who), br = activeBreak(who);
  const isMe = S.me === who;
  let status;
  if(todays.length) status = `<div class="today-st done">✓ Ran today · ${mi(sumMi(todays))} mi</div>`;
  else if(br){ const L = breakLabel(br); status = `<div class="today-st ice">${L.e} On break · ${L.n}</div>`; }
  else status = `<div class="today-st not">○ Not yet today</div>`;
  return `<div class="runner ${p.cls}">
    <div class="who"><b>${p.name}</b>${isMe?'<span class="you">YOU</span>':''}</div>
    <div class="ring">${ring(wr/goal, p.c)}<div class="n"><div><b>${wr}</b><small>of ${goal} / wk</small></div></div></div>
    <div class="stats">
      <div><b>${st}${st?' 🔥':''}${br&&!todays.length?' 🧊':''}</b><small>Streak</small></div>
      <div><b>${mi1(sumMi(logsIn(who, t.slice(0,4)+'-01-01', t)))}</b><small>Mi in ${t.slice(0,4)}</small></div>
    </div>
    ${status}
  </div>`;
}
function weekStrip(){
  const t = today(), ws = weekStart(t);
  return '<div class="week">' + range(ws, shift(ws,6)).map(d=>{
    const fut = d > t, o = ranOn('oliver',d), a = ranOn('alexis',d);
    const ob = !o && breakOn('oliver',d) && !fut, ab = !a && breakOn('alexis',d) && !fut;
    return `<button class="wd ${d===t?'today':''} ${fut?'future':''}" onclick="openDay('${d}')"><div class="sq"><i class="${o?'o':''} ${ob?'brk':''}"></i><i class="${a?'a':''} ${ab?'brk':''}"></i></div><small>${'MTWTFSS'[(parse(d).getDay()+6)%7]}</small></button>`;
  }).join('') + '</div>';
}
function renderHome(){
  const t = today(), ws = weekStart(t);

    if(myBr && !iRan){ const L = breakLabel(myBr); call = callout(L.e, 'You’re on a break · '+L.n, L.span+'. Your streak is frozen, not lost.', `<button class="btn ice sm" onclick="endBreak('${myBr.id}')">I’m Back</button>`, 'ice'); }

    else if(!theyRan && theirBr){ const L = breakLabel(theirBr); call = callout(L.e, P[them].name+' is on a break', L.n+' · '+L.span+'. No nudging — send some love instead.', ''); }
    else if(!theyRan) call = callout('📣', P[them].name+' hasn’t run yet', 'Send a little push their way.', `<button class="btn" onclick="openNudge()">Nudge</button>`);
    else call = callout('🤝', 'You both ran today', ts > 1 ? ts+' days in a row together. Keep it going.' : 'Both squares filled. That’s how it’s done.', '');

  const live = chList().filter(c => chStatus(c) === 'active').sort((a,b)=>(a.end||'9').localeCompare(b.end||'9'));

      </div>
      <div class="wkbar"><i class="o" style="width:${tot?om/tot*100:50}%"></i><i class="a" style="width:${tot?am/tot*100:50}%"></i></div>
      ${weekStrip()}
      <div class="hero-foot"><span>Week Wins <b style="color:var(--o)">${ww.oliver}</b> – <b style="color:var(--a)">${ww.alexis}</b></span><span>${ts ? '🤝 '+ts+'-day together streak' : '🧊 = break day'}</span></div>
    </div>
    ${invite}
    <div class="duel">${runnerCard('oliver')}${runnerCard('alexis')}</div>
    ${call}
    ${live.length ? `<div class="sec-h"><h2>Live Challenges</h2><button onclick="go('ch')">All</button></div>${live.slice(0,2).map(c=>chCard(c, true)).join('')}`
      : `<div class="sec-h"><h2>Challenges</h2></div>${callout('🏆','No challenge running','Set the rules, pick the stakes, and make it official.',`<button class="btn pri sm" onclick="openNewCh()">Start One</button>`)}`}

  hydratePhotos();
}

  const where = [fmtDate(l.date,{weekday:'short',month:'short',day:'numeric'}), l.time?fmtTime(l.time):'', l.loc?'📍 '+esc(l.loc):''].filter(Boolean).join(' · ');

  return `<article class="post ${p.cls}" id="post-${l.id}">
    <div class="post-h"><div class="av">${p.init}</div>
      <div class="meta"><b>${p.name}</b><div>${where}</div></div>
      ${mine?`<button class="more" onclick="openLog('${l.id}')" aria-label="Edit">•••</button>`:''}
    </div>
    <div class="post-stats">
      <div><small>Distance</small><b>${mi(l.dist)}<i>mi</i></b></div>
      <div><small>Time</small><b>${l.secs?fmtDur(l.secs):'–'}</b></div>
      <div><small>Pace</small><b>${fmtPace(pace)}<i>${pace?'/mi':''}</i></b></div>
    </div>
    ${tags.trim()?`<div class="post-tags">${tags}</div>`:''}
    ${l.notes?`<div class="post-notes">${esc(l.notes)}</div>`:''}

function breakPost(who, b){
  const L = breakLabel(b), p = P[who], mine = who === S.me, live = !b.to || b.to >= today();
  return `<div class="brkpost"><div class="e">${L.e}</div><div class="t"><b style="color:${p.c}">${p.name}</b> ${live?'is taking':'took'} a break · <b>${L.n}</b><br>${L.span}${b.note?' · '+esc(b.note):''}</div>

function renderFeed(){

/* ============================== render: challenges ============================== */
function chDates(c){
  const st = chStatus(c), t = today();
  const span = fmtDate(c.start) + (c.end ? ' – '+fmtDate(c.end) : ' · no end date');
  if(st === 'upcoming') return span+' · starts in '+plural(diffDays(t, c.start),'day');
  if(st === 'active' && c.end){ const left = diffDays(t, c.end); return span+' · '+(left ? plural(left,'day')+' left' : 'last day'); }
  return span;
}
function rulesList(c){
  const r = c.rules || {}, k = c.kind, out = [];
  if(k==='race' || (KINDS[k].teamTarget && c.mode==='team')) out.push('Target: '+c.target+' '+(KINDS[k].unit||''));
  if(k==='weekly') out.push('Target: '+c.target+' '+((r.wkUnit==='miles')?'miles':'runs')+' every week');
  if(+r.minDist) out.push('Runs count if '+r.minDist+'+ mi');
  if(r.types && r.types.length) out.push('Only: '+r.types.join(', '));
  if(k==='daily' && +r.rest) out.push(plural(+r.rest,'free rest day')+' per week');
  if((k==='daily'||k==='weekly')){
    const s = strikesOf(c);
    out.push(s===null ? 'No elimination' : s===0 ? 'Sudden death: one miss and you’re out' : plural(s,'strike')+' allowed, then you’re out');
    out.push(r.breaksPause===false ? 'Break days count as misses' : 'Break days don’t count as misses');
  }
  if(k==='pace' && +r.minTotal) out.push('Need '+r.minTotal+'+ timed miles to qualify');
  return out;
}
function chCard(c, compact){
  const st = chStatus(c), R = chResult(c), k = KINDS[c.kind] || KINDS.miles, team = c.mode === 'team';
  const invited = S.me && c.createdBy !== S.me && !(c.accepted||{})[S.me] && st !== 'finished';
  const waiting = S.me && c.createdBy === S.me && !(c.accepted||{})[OTHER[S.me]] && st !== 'finished';
  const total = c.end ? diffDays(c.start, c.end) + 1 : 0, gone = Math.max(0, Math.min(total, diffDays(c.start, today()) + 1));
  let stand = '';
  if(team){
    const pct = R.team.pct != null ? R.team.pct : null;
    const ov = R.rows.oliver.v, av = R.rows.alexis.v, tgt = +c.target || 0;
    stand = `<div class="stand"><div class="srow" style="margin-top:0"><div class="sbody"><div class="stop"><b>${R.team.disp}${tgt&&KINDS[c.kind].teamTarget?' <span style="font-family:var(--fu);font-size:13px;color:var(--tx3)">/ '+tgt+'</span>':''}</b><small>${R.team.sub||''}</small></div>
      ${pct!=null ? `<div class="teambar"><i class="o" style="width:${Math.min(100,(tgt?ov/tgt:0)*100)}%"></i><i class="a" style="width:${Math.min(100-(tgt?ov/tgt:0)*100,(tgt?av/tgt:0)*100)}%"></i></div>` : ''}
      </div></div>
      ${WHO.map(w=>`<div class="srow c-${P[w].cls}"><div class="av">${P[w].init}</div><div class="sbody"><div class="stop"><b style="font-size:17px">${R.rows[w].disp}</b><small>${R.rows[w].sub}</small></div></div></div>`).join('')}</div>`;
  } else {
    const vals = WHO.map(w=>R.rows[w].v), max = c.kind==='pace' ? 0 : Math.max(...vals, c.kind==='race'?(+c.target||0):0, .0001);
    stand = `<div class="stand">${WHO.map(w=>{
      const r = R.rows[w];
      let pct = c.kind==='pace' ? (r.v ? Math.min(...vals.filter(Boolean))/r.v : 0) : r.v/max;
      const crown = st==='finished' ? (R.winner===w ? '<span class="lead">🏆</span>' : '') : (R.leader===w ? '<span class="lead">👑</span>' : '');
      return `<div class="srow c-${P[w].cls} ${r.out?'out':''}"><div class="av">${P[w].init}</div><div class="sbody">
        <div class="stop"><b>${r.disp}${crown}</b><small>${r.out ? '❌ Out '+fmtDate(r.out) : r.sub}${c.kind==='daily'&&st==='active'&&!r.out ? (r.today?' · ✓ today':'') : ''}</small></div>
        <div class="sbar"><i style="width:${Math.max(2,pct*100)}%"></i></div></div></div>`;
    }).join('')}</div>`;
  }
  let result = '';
  if(st === 'finished'){
    if(team) result = R.teamWon ? `<div class="result"><span class="e">🎉</span>Team goal crushed. You did it together.</div>` : `<div class="result"><span class="e">😮‍💨</span>Didn’t make it this time. Run it back?</div>`;
    else result = R.winner==='tie' || !R.winner ? `<div class="result"><span class="e">🤝</span>Dead even. It’s a tie.</div>` : `<div class="result" style="color:${P[R.winner].c}"><span class="e">🏆</span>${P[R.winner].name} wins${c.stakes?' — '+esc(P[OTHER[R.winner]].name)+' pays up':''}</div>`;
  }
  const actions = [];
  if(!compact){
    if(invited) actions.push(`<button class="btn pri" onclick="acceptCh('${c.id}')">Accept</button>`, `<button class="btn" onclick="declineCh('${c.id}')">Decline</button>`);
    if(c.createdBy === S.me && st !== 'finished') actions.push(`<button class="btn" onclick="endCh('${c.id}')">End Now</button>`);
    if(c.createdBy === S.me || st === 'finished') actions.push(`<button class="btn ghost danger" onclick="deleteCh('${c.id}')">Delete</button>`);
    if(st === 'finished') actions.push(`<button class="btn" onclick="rematch('${c.id}')">Rematch</button>`);
  }
  return `<div class="ch ${invited?'invite':''} ${st==='finished'?'done':''}" ${compact?`onclick="go('ch')" style="cursor:pointer"`:''}>
    <div class="ch-h"><div class="e">${esc(c.emoji||k.e)}</div><div class="tt"><b>${esc(c.name)}</b><small>${chDates(c)}</small></div></div>
    <div class="meta"><span class="tag">${k.e} ${k.n}</span><span class="tag">${team?'🤝 Team':'⚔️ Versus'}</span>
      ${invited?'<span class="tag rec">📨 Invite for you</span>':''}${waiting?`<span class="tag">⏳ Waiting for ${P[OTHER[S.me]].name}</span>`:''}
      ${st==='upcoming'?'<span class="tag ice">Upcoming</span>':''}</div>
    ${total && st==='active' ? `<div class="timebar"><i style="width:${gone/total*100}%"></i></div>` : ''}
    ${st==='upcoming' ? '' : stand}
    ${!compact ? `<ul class="rules">${rulesList(c).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>` : ''}
    ${c.stakes ? `<div class="stakes">🎲 Stakes: ${esc(c.stakes)}</div>` : ''}
    ${result}
    ${actions.length ? `<div class="row-btns">${actions.join('')}</div>` : ''}
  </div>`;
}
function renderCh(){

/* ============================== new challenge ============================== */
let CD = null;
function openNewCh(tpl){
  if(!S.me) return pickWho();
  const t = today();
  CD = {name:'', emoji:'🔥', kind:'daily', mode:'versus', start:t, days:14, end:shift(t,13), noEnd:false, target:'', stakes:'',
        rules:{minDist:'', types:[], breaksPause:true, rest:0, strikes:'', wkUnit:'runs', minTotal:''}};
  if(tpl) applyTpl(tpl, true);
  renderNewCh();
}
function applyTpl(i, silent){
  const T = TEMPLATES[i]; if(!T) return;
  Object.assign(CD, {name:T.name, emoji:T.emoji, kind:T.kind, mode:T.mode, target:T.target||''});
  CD.rules = {minDist:'', types:[], breaksPause:true, rest:0, strikes:'', wkUnit:'runs', minTotal:'', ...(T.rules||{})};
  if(T.days){ CD.noEnd = false; CD.days = T.days; CD.end = shift(CD.start, T.days-1); } else { CD.noEnd = true; CD.days = 0; }
  if(!silent) renderNewCh();
}
function renderNewCh(){
  const k = KINDS[CD.kind], team = CD.mode === 'team', r = CD.rules;
  const needTarget = k.target || (k.teamTarget && team);
  const unit = CD.kind==='weekly' ? (r.wkUnit==='miles'?'miles / week':'runs / week') : (k.unit==='mi'?'miles':'runs');
  const strikeOpts = [['','Unlimited'],['0','Sudden Death'],['1','1 Strike'],['2','2 Strikes'],['3','3 Strikes']];
  openSheet(`<h3>New Challenge <button onclick="closeSheet()">Cancel</button></h3>
    <div class="fld"><label>Quick Start</label><div class="tpl">${TEMPLATES.map((T,i)=>`<button onclick="applyTpl(${i})"><span>${T.emoji}</span><div>${T.name}<small>${T.sub}</small></div></button>`).join('')}</div></div>

    <div class="fld"><label>Icon</label><div class="emojis">${CH_EMOJIS.map(e=>`<button class="${CD.emoji===e?'on':''}" onclick="CD.emoji='${e}';renderNewCh()">${e}</button>`).join('')}</div></div>
    <div class="fld"><label>Type</label><div class="kinds">${Object.entries(KINDS).map(([id,K])=>`<button class="${CD.kind===id?'on':''}" onclick="setKind('${id}')"><b>${K.e} ${K.n}</b><small>${K.d}</small></button>`).join('')}</div></div>
    <div class="fld"><label>Format</label><div class="opts">
      <button class="opt ${!team?'on':''}" onclick="CD.mode='versus';renderNewCh()">⚔️ Versus</button>
      ${k.team ? `<button class="opt ${team?'on':''}" onclick="CD.mode='team';renderNewCh()">🤝 Team</button>` : ''}

function setKind(id){ CD.kind = id; if(!KINDS[id].team) CD.mode = 'versus'; if(CD.noEnd && !(id==='race' || (KINDS[id].teamTarget && CD.mode==='team'))){ CD.noEnd=false; setLen(14); return; } renderNewCh(); }

function checkChEvents(){

    const e = team ? (R.teamWon ? '🎉' : '😮‍💨') : (iWon ? '🏆' : tie ? '🤝' : '🥈');
    const h = team ? (R.teamWon ? 'Team Goal Hit' : 'So Close') : (iWon ? 'You Won' : tie ? 'It’s A Tie' : P[R.winner].name+' Wins');
    const p = esc(c.emoji+' '+c.name) + (c.stakes && !team && !tie ? '<br>Stakes: '+esc(c.stakes) : '');

function periodRange(p){
  const t = today();
  if(p === 'week') return [weekStart(t), t];
  if(p === 'month') return [t.slice(0,7)+'-01', t];
  if(p === 'year') return [t.slice(0,4)+'-01-01', t];
  return [clubStart() < '2000-01-01' ? '2000-01-01' : '2000-01-01', t];
}
function h2hRow(label, ov, av, fmt, lowerWins){
  const sc = v => { v = +v||0; return lowerWins ? (v ? 1/v : 0) : v; };
  const oS = sc(ov), aS = sc(av), tot = oS + aS, oW = tot ? oS/tot*100 : 50;
  const win = oS===aS ? null : (oS>aS ? 'o' : 'a');
  return `<div class="h2h-row">
    <div class="lbl"><b class="${win==='o'?'win':''}" style="color:var(--o)">${fmt(ov)}</b><em>${label}</em><b class="${win==='a'?'win':''}" style="color:var(--a)">${fmt(av)}</b></div>
    <div class="vs"><i class="o" style="width:${oW}%"></i><i class="a" style="width:${100-oW}%"></i></div>
  </div>`;
}
function weeklyChart(){
  const W = 340, H = 170, pl = 26, pr = 6, pt = 10, pb = 22, N = 12;
  const ws0 = weekStart(today()), weeks = Array.from({length:N}, (_,i)=>shift(ws0, -7*(N-1-i)));
  const vals = weeks.map(ws => WHO.map(w=>sumMi(logsIn(w, ws, shift(ws,6)))));
  const max = Math.max(5, ...vals.flat()) * 1.1;
  const cw = (W-pl-pr)/N, bw = Math.max(3, cw/2 - 3), y = v => pt + (H-pt-pb)*(1-v/max);
  let g = '';
  [0,.5,1].forEach(f=>{ const v = max/1.1*f; g += `<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(255,255,255,.06)"/><text x="${pl-5}" y="${y(v)+3.5}" fill="#6b7083" font-size="9" text-anchor="end" font-weight="600">${Math.round(v)}</text>`; });
  vals.forEach((v,i)=>{
    const x = pl + i*cw + 2;
    g += `<rect x="${x}" y="${y(v[0])}" width="${bw}" height="${Math.max(0,y(0)-y(v[0]))}" rx="2.5" fill="#ff7a2f"/><rect x="${x+bw+2}" y="${y(v[1])}" width="${bw}" height="${Math.max(0,y(0)-y(v[1]))}" rx="2.5" fill="#b48cff"/>`;
    if(i % 3 === 0 || i === N-1) g += `<text x="${x+bw}" y="${H-6}" fill="#6b7083" font-size="9" text-anchor="middle" font-weight="600">${i===N-1?'Now':fmtDate(weeks[i])}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;
}
function monthCal(){
  const [y,m] = S.calMonth.split('-').map(Number), first = new Date(y, m-1, 1), lead = (first.getDay()+6)%7, n = new Date(y, m, 0).getDate(), t = today();
  let cells = ['M','T','W','T','F','S','S'].map(d=>`<div class="dn">${d}</div>`).join('');
  for(let i=0;i<lead;i++) cells += '<div class="cell out"></div>';
  for(let i=1;i<=n;i++){
    const d = iso(new Date(y, m-1, i)), o = ranOn('oliver',d), a = ranOn('alexis',d), fut = d > t;
    const ob = !o && !fut && breakOn('oliver',d), ab = !a && !fut && breakOn('alexis',d);
    cells += `<button class="cell ${o?'ho':''} ${d===t?'today':''} ${fut?'future':''}" onclick="openDay('${d}')">
      <div class="halves"><i class="o ${o?'on':''} ${ob?'brk':''}"></i><i class="a ${a?'on':''} ${ab?'brk':''}"></i></div>
      <span class="d">${i}</span>${o&&a?'<span class="star">⭐</span>':''}</button>`;
  }
  const label = first.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  return `<div class="mcal-h"><button onclick="moveMonth(-1)">‹</button><b>${label}</b><button onclick="moveMonth(1)">›</button></div><div class="mcal">${cells}</div>
    <div class="legend"><span><i style="background:var(--o)"></i>Oliver</span><span><i style="background:var(--a)"></i>Alexis</span><span><i class="brk"></i>Break</span><span>⭐ Both</span></div>`;

function moveMonth(n){ const [y,m] = S.calMonth.split('-').map(Number); const d = new Date(y, m-1+n, 1); S.calMonth = iso(d).slice(0,7); const el = $('#calBox'); if(el) el.innerHTML = monthCal(); }
function goalBlock(who){
  const g = yearGoal(who), t = today(), y = t.slice(0,4), done = sumMi(logsIn(who, y+'-01-01', t)), p = P[who];
  if(!g) return `<div class="goal"><div class="gr">${ring(0,p.c,12)}<b>–</b></div><div class="gt"><b style="color:${p.c}">${p.name}</b>${mi1(done)} mi in ${y}. ${who===S.me?'<a href="#" onclick="openSettings();return false" style="color:var(--me);font-weight:700">Set a yearly goal</a>':'No yearly goal set.'}</div></div>`;
  // pace is measured from Jan 1 or the club's start, whichever is later, so a goal set mid-year isn't instantly "behind"
  const from = clubStart() > y+'-01-01' ? clubStart() : y+'-01-01';
  const expect = g * (diffDays(from, t) + 1) / (diffDays(from, y+'-12-31') + 1), diff = done - expect;

}

let mapObj = null;
function loadLeaflet(){
  if(window.L) return Promise.resolve();
  if(loadLeaflet.p) return loadLeaflet.p;
  return loadLeaflet.p = new Promise((res,rej)=>{ const s = document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js'; s.onload=res; s.onerror=rej; document.head.appendChild(s); });
}
async function drawMap(){
  try{ await loadLeaflet(); }catch(e){ const m = $('#map'); if(m) m.innerHTML = '<div class="empty">Map couldn’t load offline.</div>'; return; }
  const el = $('#map'); if(!el) return;
  if(mapObj){ mapObj.remove(); mapObj = null; }
  mapObj = L.map(el, {zoomControl:false, attributionControl:true});
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'© OpenStreetMap'}).addTo(mapObj);
  const pts = [];
  Object.values(S.logs).filter(l=>l.lat!=null && P[l.who]).forEach(l=>{
    const p = P[l.who];
    const icon = L.divIcon({className:'', html:`<div class="pin" style="background:${p.c}"></div>`, iconSize:[16,16], iconAnchor:[8,8]});
    L.marker([l.lat,l.lng],{icon}).addTo(mapObj).bindPopup(`<b style="color:${p.c}">${p.name}</b> · ${fmtDate(l.date)}<br>${mi(l.dist)} mi${l.loc?' · '+esc(l.loc):''}`);
    pts.push([l.lat,l.lng]);
  });
  if(pts.length===1) mapObj.setView(pts[0], 13); else mapObj.fitBounds(pts, {padding:[30,30], maxZoom:14});
}

function hydratePhotos(){

async function getPhoto(id){
  if(S.photos[id]) return S.photos[id];
  const local = LS.get('rc_ph_'+id, null);
  if(local) return S.photos[id] = local;
  if(!syncOn) return [];

function viewPhoto(id, i){

function compress(file){
  return new Promise((res,rej)=>{
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = ()=>{
      let max = 1000, q = .72, out = '';
      for(let tries=0; tries<8; tries++){
        let {width:w, height:h} = img;
        if(w>max||h>max){ const k = max/Math.max(w,h); w = Math.round(w*k); h = Math.round(h*k); }
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        out = c.toDataURL('image/jpeg', q);
        if(out.length <= 180000) break;
        if(q > .5) q -= .1; else max = Math.round(max*.85);
      }
      URL.revokeObjectURL(url); res(out);
    };
    img.onerror = rej; img.src = url;
  });
}
